<style>
:root{--bg:#faf6ef;--card:#fffdf8;--ink:#2b2620;--mute:#6f665a;--line:#e6dccb;--accent:#b4491f;--accent-ink:#fff;--ok:#2f6b3f;--okbg:#e3f0e2;--warn:#8a5a00;--warnbg:#fbeccb;--chip:#f1e8d8;--bad:#8c2a12;--badbg:#f6d4cc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1914;--card:#26221b;--ink:#f2ebdd;--mute:#a79d8c;--line:#3a3429;--accent:#e57a4a;--accent-ink:#1c1914;--ok:#8fd19e;--okbg:#22382a;--warn:#f0c15f;--warnbg:#3b2f14;--chip:#332d23;--bad:#f2a38c;--badbg:#4a2118}}
:root[data-theme="dark"]{--bg:#1c1914;--card:#26221b;--ink:#f2ebdd;--mute:#a79d8c;--line:#3a3429;--accent:#e57a4a;--accent-ink:#1c1914;--ok:#8fd19e;--okbg:#22382a;--warn:#f0c15f;--warnbg:#3b2f14;--chip:#332d23;--bad:#f2a38c;--badbg:#4a2118}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 80px}
h1{font:700 26px/1.15 Georgia,"Times New Roman",serif;margin:4px 0 2px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.tabs{display:flex;gap:6px;margin:0 0 14px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:0;padding:10px 12px;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-size:13px;cursor:pointer}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.day{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
.title{font:600 18px/1.25 Georgia,serif;margin:4px 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.chip{background:var(--chip);border-radius:99px;padding:2px 10px;font-size:12.5px}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.prow{padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}

.prow input[type=date]{width:auto;flex:none;padding:8px}

button.b.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.aheadbar b.h{display:block;font-size:16px;margin-bottom:4px}
.aheadbar .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.aheadbar .acts button{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:600}
.aheadbar .acts button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.banner{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13.5px;margin:0 0 12px}
.grp{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:18px 0 4px}

.srow .nm{overflow-wrap:anywhere}

.srow select{max-width:116px;flex:none}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.addrow input{flex:1 1 150px;width:auto}
#sb{margin:0 0 12px;display:none;gap:8px;align-items:center}

#sx{flex:none;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.alts .who{margin-top:2px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.seg button{font:inherit;font-size:13.5px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:36px}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg button.no.on{background:var(--bad);color:var(--accent-ink);border-color:var(--bad)}
#ck{--ckaccbg:color-mix(in srgb,var(--accent) 14%,var(--card));font-size:17px;line-height:1.45}

#ck .ck-step.ck-cur{background:var(--ckaccbg);margin:0 -8px;padding:10px 8px;border-radius:10px}
#ck .ck-step.ck-past{color:var(--mute)}
#ck .ck-big{font-size:21px;line-height:1.5}
#ck .ck-bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
#ck .ck-bar i{display:block;height:100%;background:var(--accent)}
#ck .ck-nav{z-index:5;position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
#ck .ck-nav div{max-width:680px;margin:0 auto;display:flex;gap:8px}
#ck .ck-nav button{flex:1;padding:14px}
#ck .ck-tm{font-size:28px;font-variant-numeric:tabular-nums;font-weight:700}
#ck .ck-safe{background:var(--card,transparent);border:2px solid var(--ok);border-radius:10px;padding:10px;margin:10px 0;font-size:15px}

#ck .ck-warnbox{background:var(--ckaccbg);border:1px solid var(--accent);border-radius:10px;padding:10px;margin:8px 0;font-size:15px}

#ck .ck-eq:last-child{border:0}

#ck .ck-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>

<script>
(function(){
var S={kit:null,ext:null,recipes:[],cur:null,mode:"cook",step:0,done:{},pdone:{},loaded:false,tms:{},wake:null};
var app=null;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c.split(" ").map(function(k){return k?"ck-"+k:""}).join(" ");if(x!=null)e.textContent=x;return e}
function ls(k,v){try{if(v===undefined){return JSON.parse(localStorage.getItem(k)||"null")}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function save(){if(S.cur)ls("cook:"+S.cur.id,{step:S.step,done:S.done,prep:S.pdone})}
function open(r){S.cur=r;var p=ls("cook:"+r.id)||{};S.step=p.step||0;S.done=p.done||{};S.pdone=p.prep||{};S.mode=(hasPrep(r)&&!(p.step>0))?"prep":"cook";S.tms={};render();window.scrollTo(0,0)}
function hasPrep(r){return (r.prep||[]).length||(r.equip||[]).length||(r.flow||[]).length}
function norm(t){return String(t||"").toLowerCase().replace(/\s+/g," ").trim()}
function eqState(n){var L=(window.CookExt&&window.CookExt.equip&&window.CookExt.equip())||[];var f=null;L.forEach(function(x){if(norm(x.name)===norm(n))f=x});if(!f)return "unset";return f.have==="yes"?"yes":f.have==="no"?"no":"unset"}
function ingMap(r){var m={};(r.ingredients||[]).forEach(function(i){m[i.id]=i});return m}
function wakeOn(){try{if(navigator.wakeLock&&!S.wake){navigator.wakeLock.request("screen").then(function(w){S.wake=w;w.addEventListener("release",function(){S.wake=null})}).catch(function(){})}}catch(e){}}
document.addEventListener("visibilitychange",function(){if(!document.hidden&&S.cur)wakeOn()});
function fmt(s){var m=Math.floor(s/60),x=s%60;return m+":"+(x<10?"0":"")+x}
setInterval(function(){Object.keys(S.tms).forEach(function(k){var t=S.tms[k];if(!t)return;var left=Math.round((t.end-Date.now())/1000);
  if(!t.fired&&left<=0){t.fired=true;try{navigator.vibrate&&navigator.vibrate([400,200,400,200,400])}catch(e){}if(+k!==S.step&&S.mode==="cook")render()}
  var txt=t.fired?"Time's up!":fmt(left);var n=document.getElementById("tmb"+k);if(n)n.textContent=txt;if(+k===S.step){var m=document.getElementById("tmv");if(m)m.textContent=txt}})},500);

function fbx(){return window.CookExt&&window.CookExt.fb}
function newFb(fin){return {v:"",note:"",prep:"",cook:"",fin:!!fin,err:""}}
function verdictLabel(v){return v==="again"?"Make again":v==="changes"?"Make again with changes":v==="never"?"Don't make again":""}
function finishCook(){S.step=0;S.done={};S.pdone={};S.fb=null;save();S.cur=null;render()}
function fmtDate(ts){try{return new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric"})}catch(e){return""}}
function renderFeedback(r){
  var F=fbx(),f=S.fb||(S.fb=newFb(false));app.textContent="";
  var back=el("button",null,"← Back");back.onclick=function(){S.mode=f.fin?"cook":"whole";S.fb=null;render()};app.appendChild(back);
  app.appendChild(el("h1",null,"How did it go?"));app.appendChild(el("div","mut",r.title));
  if(!F||!F.can()){app.appendChild(el("div","warnbox","Feedback can't be saved right now (not signed in or read-only)."))}
  if(f.fin)app.appendChild(leftCard(r,true));
  var c=el("div","card");c.appendChild(el("h2",null,"Make it again?"));
  [["again","Make again"],["changes","Make again with changes"],["never","Don't make again"]].forEach(function(o){
    var b=el("button",f.v===o[0]?"pri":"",o[1]);b.style.cssText="display:block;width:100%;margin:6px 0;text-align:left";b.onclick=function(){f.v=o[0];render()};c.appendChild(b)});
  var hint=f.v==="again"?"It goes in the favorites pool for future weeks.":f.v==="changes"?"Say what to change below. Claude rewrites the recipe before it comes back and tells you what changed.":f.v==="never"?"It moves to Archived right away and won't be suggested again. You can restore it later.":"";
  if(hint)c.appendChild(el("div","mut",hint));app.appendChild(c);
  var n=el("div","card");n.appendChild(el("h2",null,"Notes"));
  var ta=el("textarea");ta.rows=4;ta.placeholder="e.g. too spicy for Lenora, needs more sauce, tofu didn't crisp";ta.value=f.note;ta.oninput=function(){f.note=ta.value};n.appendChild(ta);
  n.appendChild(el("div","mut","Real times, if they were off (minutes, optional). Planned: "+(r.time||"not set")));
  var tr=el("div","row");tr.style.marginTop="8px";
  [["prep","Real prep"],["cook","Real cook"]].forEach(function(t){var w=el("div");w.style.flex="1";w.appendChild(el("div","mut",t[1]));var i=el("input");i.type="number";i.min="0";i.inputMode="numeric";i.value=f[t[0]];i.oninput=function(){f[t[0]]=i.value};w.appendChild(i);tr.appendChild(w)});
  n.appendChild(tr);app.appendChild(n);
  var ph=el("div","card");ph.appendChild(el("h2",null,"Photo"));var PA=photoApi();var cur=pimg(r.id,200);if(cur)ph.appendChild(cur);
  ph.appendChild(el("div","mut",cur?"Your photo of this dish. Add a new one to replace it.":"Snap the finished dish. It shows up on the week plan and in Cook Mode."));
  var fi=el("input");fi.type="file";fi.accept="image/*";fi.style.display="none";var pb0=el("button",null,cur?"Replace photo":"Add a photo");pb0.style.marginTop="8px";pb0.disabled=!PA||!PA.can();
  pb0.onclick=function(){fi.click()};fi.onchange=function(){var f=fi.files&&fi.files[0];if(!f)return;pb0.disabled=true;pb0.textContent="Saving…";PA.add(r.id,f).then(function(ok){if(ok!==true)f_err(ok==="full"?"Could not save that photo.":"Could not save that photo.");render()})};
  function f_err(t){S.fb&&(S.fb.err=t)}
  ph.appendChild(fi);ph.appendChild(pb0);app.appendChild(ph);
  var pc=el("div","card");pc.appendChild(el("h2",null,"Pantry"));
  pc.appendChild(el("div","mut",f.pdone!=null?"Pantry updated ("+f.pdone+" item"+(f.pdone===1?"":"s")+"). You can adjust it again if you missed something.":"Mark what you used up so the pantry counts stay right. You'll review everything before it's saved."));
  var pb=el("button",null,f.pdone!=null?"Update pantry again →":"Update pantry →");pb.style.marginTop="8px";pb.disabled=!pantryApi();pb.onclick=function(){S.pu=null;S.mode="pantry";render();window.scrollTo(0,0)};pc.appendChild(pb);app.appendChild(pc);
  if(f.err)app.appendChild(el("div","warnbox",f.err));
  var row=el("div","row");var sv=el("button","pri","Save");sv.disabled=!f.v||!F||!F.can();
  sv.onclick=function(){sv.disabled=true;F.submit(r,{v:f.v,note:(f.note||"").trim(),prep:f.prep,cook:f.cook}).then(function(ok){
    if(!ok){f.err="Could not save that. Check your connection and try again.";render();return}
    var fin=f.fin,v=f.v;S.fb=null;S.toast=v==="never"?"Archived: "+r.title+". It won't be suggested again.":"Thanks, feedback saved.";
    if(fin)finishCook();else if(v==="never"){S.cur=null;render()}else{S.mode="whole";render()}})};
  row.appendChild(sv);
  if(f.fin){var sk=el("button",null,"Skip");sk.onclick=function(){finishCook()};row.appendChild(sk)}
  app.appendChild(row);
  var past=F?F.list(r.id):[];
  if(past.length){var h=el("div","card");h.appendChild(el("h2",null,"Earlier feedback"));
    past.forEach(function(e){var d=el("div");d.style.cssText="padding:8px 0;border-bottom:1px solid var(--line)";
      d.appendChild(el("div","mut",F.who(e.by)+" · "+fmtDate(e.ts)+(verdictLabel(e.verdict)?" · "+verdictLabel(e.verdict):e.verdict==="restored"?" · Restored":"")));
      if(e.note)d.appendChild(el("div",null,e.note));
      if(e.times&&(e.times.prep||e.times.cook))d.appendChild(el("div","mut","Real time: "+[e.times.prep?"prep "+e.times.prep+" min":"",e.times.cook?"cook "+e.times.cook+" min":""].filter(Boolean).join(", ")));
      h.appendChild(d)});app.appendChild(h)}
}

function aheadApi(){return window.CookExt&&window.CookExt.ahead}
function renderGate(r){var A=aheadApi(),m=A&&A.pending(r.date);app.textContent="";
  var back=el("button",null,"← All recipes");back.onclick=function(){S.cur=null;render()};app.appendChild(back);
  app.appendChild(el("h1",null,"Before you start"));app.appendChild(el("div","mut",r.title));
  var c=el("div","warnbox");c.style.padding="14px";c.appendChild(el("b",null,"Did you make ahead?"));c.appendChild(el("p",null,r.ahead||(m&&m.ahead)||""));app.appendChild(c);
  function btn(t,cls,fn){var b=el("button",cls,t);b.style.cssText="width:100%;padding:14px;margin:6px 0";b.onclick=fn;app.appendChild(b)}
  btn("Yes, it's done","pri",function(){A.done(m,"done");S.gateOk=S.gateOk||{};S.gateOk[r.id]=1;render();window.scrollTo(0,0)});
  btn("Not yet, show me the prep list","",function(){S.gateOk=S.gateOk||{};S.gateOk[r.id]=1;S.mode=hasPrep(r)?"prep":"whole";render();window.scrollTo(0,0)});
  btn("Skip it, I'll do it all fresh (takes longer)","",function(){A.done(m,"skipped");S.gateOk=S.gateOk||{};S.gateOk[r.id]=1;render();window.scrollTo(0,0)})}
function vpLine(r){var F=fbx();var vp=r.vp||{};var ks=Object.keys(vp);if(!ks.length)return r.verdict?verdictLabel(r.verdict):"";
  return ks.map(function(k){return (F&&F.who?F.who(k):"Someone")+": "+verdictLabel(vp[k])}).join(" · ")}
function expiring(date){var r=null;S.recipes.forEach(function(x){if(x.date===date)r=x});var P=pantryApi();if(!r||!P)return [];
